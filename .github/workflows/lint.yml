name: Lint

on:
  push:
    branches: [main, dev]

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    container: silkeh/clang:21
    env:
      SCL_UTILITY_SRC: /tmp/scl-utility/src
    steps:
      - uses: actions/checkout@v7

      - name: Install git
        run: apt-get update && apt-get install -y git

      - name: Clone scl-utility
        run: git clone --depth=1 --branch dev https://github.com/ssoft-hub/scl-utility.git /tmp/scl-utility

      - name: Run clang-tidy
        run: bash script/lint/clang_tidy.sh

  clang-format:
    runs-on: ubuntu-latest
    container: silkeh/clang:21
    steps:
      - uses: actions/checkout@v7

      - name: Check formatting
        run: bash script/lint/clang_format.sh

  cppcheck:
    runs-on: ubuntu-latest
    env:
      SCL_UTILITY_SRC: /tmp/scl-utility/src
    steps:
      - uses: actions/checkout@v7

      - name: Install cppcheck
        run: |
          sudo apt-get update && sudo apt-get install -y cppcheck
          cppcheck --version

      - name: Clone scl-utility
        run: git clone --depth=1 --branch dev https://github.com/ssoft-hub/scl-utility.git /tmp/scl-utility

      - name: Run cppcheck
        run: bash script/lint/cppcheck.sh
