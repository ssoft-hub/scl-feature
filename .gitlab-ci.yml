# A pipeline runs for a merge request, for main and dev, and for a tag. A plain branch
# push starts nothing, and the checks answer for what a merge request proposes: the same
# commits reach dev through one, and GitHub lints dev and main for nothing on top.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(main|dev)$/
    - if: $CI_COMMIT_TAG

stages: [lint, publish]

variables:
  SCL_SRC_DIR: src

clang:
  stage: lint
  image: silkeh/clang:21
  variables:
    SCL_UTILITY_SRC: /tmp/scl-utility/src
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - git clone --depth=1 --branch dev "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_NAMESPACE}/scl-utility.git" /tmp/scl-utility
  script:
    - status=0
    - bash script/lint/clang_tidy.sh || status=1
    - bash script/lint/clang_format.sh || status=1
    - exit $status

cppcheck:
  stage: lint
  image: ubuntu:24.04
  variables:
    SCL_UTILITY_SRC: /tmp/scl-utility/src
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apt-get update && apt-get install -y cppcheck git
    - cppcheck --version
    - git clone --depth=1 --branch dev "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_NAMESPACE}/scl-utility.git" /tmp/scl-utility
  script:
    - bash script/lint/cppcheck.sh

# ---------------------
# Documentation
# ---------------------
pages:
  stage: publish
  image: archlinux:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  variables:
    GIT_DEPTH: 0
  before_script:
    - pacman -Sy --noconfirm doxygen graphviz python git ca-certificates
    - git fetch --prune --tags
  script:
    - sh script/ci/deploy_versioned_docs.sh public
  artifacts:
    paths:
      - public

# ---------------------
# Mirror to GitHub
# ---------------------
mirror:github:
  stage: publish
  image:
    name: alpine/git
    entrypoint: [""]
  # One run carries every branch and tag across, so dev or main moving is enough for a
  # branch. The tag entry is not spare: GitHub builds the documentation of a version
  # from the mirrored tag.
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(main|dev)$/
    - if: $CI_COMMIT_TAG
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    # Set in GitLab CI/CD group variables (ssoft-scl):
    #   GITHUB_TOKEN       - GitHub PAT with Contents: Write (masked)
    # Set in GitLab CI/CD project variables:
    #   GITHUB_MIRROR_URL  - https://github.com/ssoft-hub/scl-feature.git
  script:
    - sh script/ci/mirror_github.sh
