stages: [lint, publish]

variables:
  SCL_SRC_DIR: src

clang-tidy:
  stage: lint
  image: silkeh/clang:21
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(main|dev)$/
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - git clone --depth=1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_NAMESPACE}/scl-utility.git" /tmp/scl-utility
  script:
    - |
      [ -d "$SCL_SRC_DIR" ] || { echo "No sources, skipping."; exit 0; }
      find $SCL_SRC_DIR \( -name '*.h' -o -name '*.hpp' \) | while IFS= read -r f; do
        clang-tidy "$f" --quiet --warnings-as-errors='*' -- -std=c++20 -xc++ -I$SCL_SRC_DIR -I/tmp/scl-utility/src || exit 1
      done

clang-format:
  stage: lint
  image: silkeh/clang:21
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(main|dev)$/
  script:
    - |
      [ -d "$SCL_SRC_DIR" ] || { echo "No sources, skipping."; exit 0; }
      find $SCL_SRC_DIR \( -name '*.h' -o -name '*.hpp' \) | xargs --no-run-if-empty clang-format \
        --dry-run \
        --Werror

cppcheck:
  stage: lint
  image: ubuntu:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(main|dev)$/
  before_script:
    - apt-get update && apt-get install -y cppcheck
    - cppcheck --version
  script:
    - |
      [ -d "$SCL_SRC_DIR" ] || { echo "No sources, skipping."; exit 0; }
      find $SCL_SRC_DIR \( -name '*.h' -o -name '*.hpp' \) -exec cppcheck \
        --enable=warning,style,performance,portability \
        --std=c++20 \
        --language=c++ \
        --inline-suppr \
        --error-exitcode=1 \
        --suppress=missingIncludeSystem \
        --suppress=unusedFunction \
        -I$SCL_SRC_DIR \
        -UDOXYGEN \
        {} +

# ---------------------
# Documentation
# ---------------------
pages:
  stage: publish
  image: archlinux:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  variables:
    GIT_DEPTH: 0
  before_script:
    - pacman -Sy --noconfirm doxygen graphviz python git ca-certificates
    - git fetch --prune --tags
  script:
    - sh script/ci/deploy_versioned_docs.sh public
  artifacts:
    paths:
      - public

# ---------------------
# Mirror to GitHub
# ---------------------
mirror:github:
  stage: publish
  image:
    name: alpine/git
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    # Set in GitLab CI/CD group variables (ssoft-scl):
    #   GITHUB_TOKEN       - GitHub PAT with Contents: Write (masked)
    # Set in GitLab CI/CD project variables:
    #   GITHUB_MIRROR_URL  - https://github.com/ssoft-hub/scl-feature.git
  script:
    - sh script/ci/mirror_github.sh
