stages: [publish]

# ---------------------
# Documentation
# ---------------------
pages:
  stage: publish
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache doxygen graphviz ttf-freefont
  script:
    - mkdir -p public
    - (cat project/doxygen/Doxyfile; printf '\nGENERATE_HTML=YES\nGENERATE_XML=NO\nHTML_OUTPUT=.\nOUTPUT_DIRECTORY=public\n') | doxygen -
  artifacts:
    paths:
      - public

# ---------------------
# Mirror to GitHub
# ---------------------
mirror:github:
  stage: publish
  image:
    name: alpine/git
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    # Set in GitLab CI/CD group variables (ssoft-scl):
    #   GITHUB_TOKEN       - GitHub PAT with Contents: Write (masked)
    # Set in GitLab CI/CD project variables:
    #   GITHUB_MIRROR_URL  - https://github.com/ssoft-hub/scl-feature.git
  script:
    - sh script/ci/mirror_github.sh
